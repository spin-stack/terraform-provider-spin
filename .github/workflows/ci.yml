# Every change: the tests, under OpenTofu as an installation runs the provider, and lint. The
# check main's ruleset requires is named Gate, as in every spin-stack repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# go tool task downloads Task and go-tools' release from GitHub, which sheds anonymous requests
# first under load: the run's own token, with only what its permissions grant.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tests that run a configuration need it; without it they skip, and here none may.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Lint
        run: go tool task lint

      - name: Test
        run: go tool task test
