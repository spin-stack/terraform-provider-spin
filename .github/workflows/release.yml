# A tag v<semver> is a release: GoReleaser builds every platform Terraform and OpenTofu run on, and
# signs the checksums with the key the registries hold for spin-stack - which is how every
# `init` knows the binaries are ours.
#
# The key is in KMS (spin-stack/ci's signing.tf) and never leaves it: this job assumes the one role
# that may sign with it, which only the release environment's jobs may assume - and GitHub lets
# only a v* tag deploy to that environment. Its public half, for the registries, is
# `go run ./internal/cmd/kmspgp -key alias/terraform-provider-spin-signing public`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      # The GitHub release and its files.
      contents: write
      # The OIDC token the signing role is assumed with.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # This job signs: its Go comes from no cache another job saved.
          cache: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::277203350136:role/terraform-provider-spin-release
          aws-region: us-west-2

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
