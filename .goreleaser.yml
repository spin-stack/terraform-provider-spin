# What registry.terraform.io and registry.opentofu.org take for a provider: a zip per platform named
# terraform-provider-spin_<version>_<os>_<arch>.zip, the manifest, and SHA256SUMS signed by the key
# they hold for spin-stack.
version: 2
before:
  hooks:
    # Every module the binary links, with its licence, in each archive (hack/notices.sh says why).
    - hack/notices.sh _output/THIRD_PARTY_NOTICES
builds:
  - env: [CGO_ENABLED=0]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{.Version}}']
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - src: _output/THIRD_PARTY_NOTICES
        dst: THIRD_PARTY_NOTICES
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  # By the KMS key spin-stack/ci's signing.tf keeps, as the role this run assumed: kmspgp wraps what
  # KMS signs in OpenPGP, as gpg --detach-sign would write it.
  - artifacts: checksum
    cmd: go
    args: ["run", "./internal/cmd/kmspgp", "-key", "alias/terraform-provider-spin-signing", "sign", "-out", "${signature}", "${artifact}"]
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
